name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # no git token left in .git/config; this job never pushes

      # The pnpm version comes from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (full suite on Linux)
        if: matrix.os == 'ubuntu-latest'
        run: pnpm test

      - name: Test (unit suite on macOS)
        if: matrix.os == 'macos-latest'
        run: pnpm test:unit

      - name: Build
        run: pnpm build

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: CLI smoke tests
        run: |
          node dist/cli/main.js --version
          node dist/cli/main.js describe --json > $env:TEMP\tui-grade-describe.json
          node dist/cli/main.js check examples/mission

      - name: Platform-independent tests
        run: pnpm test:windows
