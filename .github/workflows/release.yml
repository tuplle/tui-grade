name: Release

# Runs for tags such as v1.2.0 and publishes the npm package, the standalone bundles and the GitHub release assets.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # creating the release and uploading the assets
  id-token: write # npm provenance / trusted publishing

jobs:
  bundles:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Build the standalone bundle
        run: node scripts/make-bundle.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: tui-grade-*.tar.gz
          if-no-files-found: error

  release:
    needs: bundles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # no git token left in .git/config; this job never pushes

      # The pnpm version comes from the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      # The release must be cut from a tag that names the version in package.json (v1.2.0 for "version": "1.2.0").
      - name: Check that the tag matches the package version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      # tui-grade-<version>.tgz: the package as `npm install` takes it
      - name: Pack the npm tarball
        run: pnpm pack

      - name: Smoke test the packed tarball with npx
        run: |
          TARBALL="$PWD/$(ls tui-grade-*.tgz | head -1)"
          npx --yes --package "$TARBALL" tui-grade --version
          npx --yes --package "$TARBALL" tui-grade --help >/dev/null

      - name: Check whether this version is already on npm
        id: npm-version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "tui-grade@$VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tui-grade@$VERSION is already on npm; the publish step will be skipped."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Trusted publishing: npmjs.com must list tuplle/tui-grade + release.yml as a trusted publisher with
      # `npm publish` allowed. The OIDC token comes from `id-token: write`; no long-lived token secret is involved.
      # Provenance is automatic under trusted publishing; the explicit flag keeps local dry runs equivalent.
      - name: Publish to npm
        if: steps.npm-version.outputs.published != 'true'
        run: pnpm publish --access public --provenance --no-git-checks

      - uses: actions/download-artifact@v8
        with:
          pattern: bundle-*
          path: artifacts
          merge-multiple: true

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
            artifacts/*.tar.gz
