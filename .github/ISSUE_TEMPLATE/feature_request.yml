name: Feature request
description: Suggest a new capability or a change in behavior.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the teaching or grading workflow, not only the proposed implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: scope
    attributes:
      label: Scope and compatibility
      description: Does this change the CLI, the YAML format, the plugin API or result files?
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked the documentation and existing issues.
          required: true
        - label: This is not a security report (those go through SECURITY.md).
          required: true
