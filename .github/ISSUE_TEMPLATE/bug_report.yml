name: Bug report
description: Something in tui-grade does not work as documented.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please do not include student data, credentials or security-sensitive details.
        For a vulnerability, use the private process in SECURITY.md instead of this issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The smallest command, assignment fragment or submission that shows the problem.
      placeholder: |
        tui-grade check examples/mission
        tui-grade run ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the relevant stderr or result files.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tui-grade version
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version and pnpm version.
      placeholder: Linux, Node 26.13.0, pnpm 12.21.0
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I read docs/troubleshooting.md.
          required: true
        - label: I removed secrets and private student data from the report.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
