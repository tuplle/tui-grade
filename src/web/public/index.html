<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>tui-grade</title>
    <script src="/theme.js"></script>
    <link rel="icon" href="/logo.png" type="image/png" />
    <link rel="stylesheet" href="/app.css" />
    <script defer src="/app.js"></script>
  </head>
  <body class="min-h-screen bg-bg text-fg antialiased" x-data="dashboard" x-init="init()" x-cloak>
    <header class="border-b border-border bg-surface">
      <div class="mx-auto flex max-w-7xl items-center gap-4 px-5 py-3">
        <a href="#/run" class="flex items-center gap-2 text-lg font-semibold tracking-tight">
          <img src="/logo.png" alt="" class="h-8 w-8 rounded-lg" />
          tui-grade
        </a>
        <span class="hidden text-xs text-muted sm:inline" x-text="version ? 'v' + version : ''"></span>
        <nav class="ml-auto flex items-center gap-1">
          <a href="#/run" class="rounded-md px-3 py-1.5 text-sm hover:bg-hover" :class="view === 'run' ? 'bg-hover font-medium' : ''">New run</a>
          <a href="#/history" class="rounded-md px-3 py-1.5 text-sm hover:bg-hover" :class="view === 'history' ? 'bg-hover font-medium' : ''">History</a>
        </nav>
        <div class="flex items-center gap-1 rounded-lg border border-border p-1" role="group" aria-label="Theme">
          <button type="button" class="rounded-md px-2 py-1 text-xs" :class="theme === 'system' ? 'bg-accent text-accent-fg' : 'text-muted hover:bg-hover'" @click="setTheme('system')" :aria-pressed="theme === 'system'">Auto</button>
          <button type="button" class="rounded-md px-2 py-1 text-xs" :class="theme === 'light' ? 'bg-accent text-accent-fg' : 'text-muted hover:bg-hover'" @click="setTheme('light')" :aria-pressed="theme === 'light'">Light</button>
          <button type="button" class="rounded-md px-2 py-1 text-xs" :class="theme === 'dark' ? 'bg-accent text-accent-fg' : 'text-muted hover:bg-hover'" @click="setTheme('dark')" :aria-pressed="theme === 'dark'">Dark</button>
        </div>
        <button type="button" class="rounded-md border border-border px-3 py-1.5 text-sm text-muted hover:bg-hover" @click="quitServer()">Quit</button>
      </div>
    </header>

    <main class="mx-auto grid max-w-7xl gap-6 px-5 py-6 lg:grid-cols-[22rem_1fr]">
      <aside class="space-y-4">
        <section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
          <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-muted">New run</h2>
          <label class="mb-1 block text-sm font-medium" for="assignment">Assignment folder</label>
          <div class="mb-3 flex gap-2">
            <input id="assignment" x-model="form.assignmentDir" class="min-w-0 flex-1 rounded-md border border-border bg-bg px-3 py-2 text-sm outline-none focus:border-accent" placeholder="~/teaching/assignment" />
            <button type="button" class="rounded-md border border-border px-3 py-2 text-sm hover:bg-hover" @click="browse('assignment')">Browse</button>
          </div>
          <label class="mb-1 block text-sm font-medium" for="submissions">Submissions folder or ZIP</label>
          <div class="mb-3 flex gap-2">
            <input id="submissions" x-model="form.inputPath" class="min-w-0 flex-1 rounded-md border border-border bg-bg px-3 py-2 text-sm outline-none focus:border-accent" placeholder="~/teaching/submissions" />
            <button type="button" class="rounded-md border border-border px-3 py-2 text-sm hover:bg-hover" @click="browse('submissions')">Browse</button>
          </div>
          <details class="mb-3 text-sm">
            <summary class="cursor-pointer text-muted">Advanced</summary>
            <div class="mt-2 space-y-2">
              <label class="block text-xs text-muted" for="only">Only scenario ids (comma separated)</label>
              <input id="only" x-model="form.only" class="w-full rounded-md border border-border bg-bg px-3 py-2 text-sm outline-none focus:border-accent" />
              <label class="block text-xs text-muted" for="locale">Report locale</label>
              <select id="locale" x-model="form.locale" class="w-full rounded-md border border-border bg-bg px-3 py-2 text-sm outline-none focus:border-accent">
                <option value="">Assignment default</option>
                <option value="en">English</option>
                <option value="sk">Slovak</option>
              </select>
              <label class="flex items-center gap-2 text-xs text-muted">
                <input type="checkbox" x-model="form.keepWorkdirs" class="h-4 w-4 rounded border-border" />
                Keep work directories
              </label>
            </div>
          </details>
          <div class="flex gap-2">
            <button type="button" class="flex-1 rounded-md border border-border px-3 py-2 text-sm font-medium hover:bg-hover disabled:opacity-50" :disabled="busy" @click="validate()">Validate</button>
            <button type="button" class="flex-1 rounded-md bg-accent px-3 py-2 text-sm font-semibold text-accent-fg hover:opacity-90 disabled:opacity-50" :disabled="busy || run?.status === 'running'" @click="startRun()">Run</button>
          </div>
          <p x-show="error" class="mt-3 rounded-md border border-danger/40 bg-danger/10 px-3 py-2 text-sm text-danger" x-text="error"></p>
          <p x-show="notice" class="mt-3 rounded-md border border-success/40 bg-success/10 px-3 py-2 text-sm text-success" x-text="notice"></p>
        </section>

        <section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
          <h2 class="mb-3 text-sm font-semibold uppercase tracking-wide text-muted">Recent runs</h2>
          <p x-show="runs.length === 0" class="text-sm text-muted">No runs yet.</p>
          <ul class="space-y-2">
            <template x-for="item in runs" :key="item.id">
              <li>
                <button type="button" class="w-full rounded-lg border border-border px-3 py-2 text-left hover:bg-hover" @click="openRun(item.id)">
                  <span class="block text-sm font-medium" x-text="item.assignment"></span>
                  <span class="block text-xs text-muted" x-text="formatDate(item.startedAt) + ' · ' + item.students.length + ' students'"></span>
                </button>
              </li>
            </template>
          </ul>
        </section>

        <section x-show="inspection" class="rounded-xl border border-border bg-surface p-4 shadow-sm">
          <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-muted">Assignment</h2>
          <p class="text-lg font-semibold" x-text="inspection?.assignment?.name"></p>
          <p class="text-sm text-muted" x-text="inspection?.assignment ? inspection.assignment.maxPoints + ' points · ' + inspection.scenarios.length + ' scenarios' : ''"></p>
          <div class="mt-2 flex flex-wrap gap-1">
            <template x-for="group in inspection?.assignment?.groups ?? []" :key="group.id">
              <span class="rounded-full border border-border px-2 py-0.5 text-xs" x-text="group.id + ' · ' + group.points"></span>
            </template>
          </div>
          <template x-if="inspection?.issues?.length">
            <ul class="mt-3 space-y-1 text-xs">
              <template x-for="issue in inspection.issues" :key="issue.path + issue.message">
                <li :class="issue.severity === 'error' ? 'text-danger' : 'text-warning'" x-text="issue.path + ': ' + issue.message"></li>
              </template>
            </ul>
          </template>
        </section>
      </aside>

      <section class="min-w-0 space-y-4">
        <template x-if="view === 'run' && !run">
          <div class="rounded-xl border border-dashed border-border bg-surface p-10 text-center">
            <h1 class="text-2xl font-semibold">Grade a class from the browser</h1>
            <p class="mx-auto mt-2 max-w-xl text-sm text-muted">Pick an assignment and a submissions folder or ZIP on the left. Validate first to see what will run; grading starts no student code until you press Run.</p>
          </div>
        </template>

        <template x-if="run && view !== 'student'">
          <div class="space-y-4">
            <section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
              <div class="flex flex-wrap items-start gap-3">
                <div class="min-w-0 flex-1">
                  <p class="text-xs uppercase tracking-wide text-muted" x-text="run.status"></p>
                  <h1 class="truncate text-xl font-semibold" x-text="run.assignment"></h1>
                  <p class="text-sm text-muted" x-text="formatDate(run.startedAt) + ' · ' + run.students.length + ' students · ' + run.id"></p>
                </div>
                <button x-show="run.status === 'running'" type="button" class="rounded-md border border-danger/50 px-3 py-2 text-sm font-medium text-danger hover:bg-danger/10" @click="stopRun()">Stop</button>
                <a x-show="run.completed" :href="'/api/runs/' + run.id + '/summary.csv'" class="rounded-md border border-border px-3 py-2 text-sm hover:bg-hover">summary.csv</a>
              </div>
              <p x-show="run.error" class="mt-3 rounded-md border border-danger/40 bg-danger/10 px-3 py-2 text-sm text-danger" x-text="run.error"></p>
              <div x-show="run.status === 'running'" class="mt-4">
                <div class="mb-1 flex justify-between text-xs text-muted">
                  <span x-text="progress.student ? 'Grading ' + progress.student : 'Preparing submissions…'"></span>
                  <span x-text="progress.total ? progress.done + ' / ' + progress.total : ''"></span>
                </div>
                <div class="h-2 overflow-hidden rounded-full bg-hover">
                  <div class="h-full rounded-full bg-accent transition-all" :style="'width:' + progressPercent() + '%'"></div>
                </div>
                <p class="mt-1 text-xs text-muted" x-text="progress.scenario ? 'Scenario: ' + progress.scenario : ''"></p>
              </div>
            </section>

            <section class="overflow-hidden rounded-xl border border-border bg-surface shadow-sm">
              <div class="flex items-center justify-between border-b border-border px-4 py-3">
                <h2 class="text-sm font-semibold uppercase tracking-wide text-muted">Results</h2>
                <span class="text-xs text-muted" x-text="run.status === 'running' ? 'Live' : 'Finished'"></span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead class="bg-hover/60 text-left text-xs uppercase tracking-wide text-muted">
                    <tr>
                      <th class="px-4 py-2">Student</th>
                      <th class="px-4 py-2 text-right">Points</th>
                      <th class="px-4 py-2"></th>
                    </tr>
                  </thead>
                  <tbody>
                    <template x-for="student in run.students" :key="student.studentId">
                      <tr class="border-t border-border">
                        <td class="px-4 py-2">
                          <span class="font-medium" x-text="student.displayName || student.studentId"></span>
                          <span class="ml-2 text-xs text-muted" x-text="student.displayName && student.displayName !== student.studentId ? student.studentId : ''"></span>
                        </td>
                        <td class="px-4 py-2 text-right font-mono" x-text="formatNumber(student.points) + ' / ' + formatNumber(student.max)"></td>
                        <td class="px-4 py-2 text-right"><button type="button" class="rounded-md px-2 py-1 text-sm text-accent hover:bg-hover" @click="openStudent(student.studentId)">Details</button></td>
                      </tr>
                    </template>
                    <tr x-show="run.students.length === 0">
                      <td colspan="3" class="px-4 py-6 text-center text-sm text-muted">No students yet.</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </section>

            <section x-show="events.length" class="rounded-xl border border-border bg-surface p-4 shadow-sm">
              <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-muted">Progress log</h2>
              <ul class="max-h-52 space-y-1 overflow-auto font-mono text-xs">
                <template x-for="event in events.slice(-50)" :key="event.seq">
                  <li class="text-muted"><span class="text-fg" x-text="event.event.type"></span> <span x-text="eventText(event.event)"></span></li>
                </template>
              </ul>
            </section>
          </div>
        </template>

        <template x-if="view === 'student' && studentResult">
          <div class="space-y-4">
            <section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
              <button type="button" class="mb-2 text-sm text-accent hover:underline" @click="backToRun()">← Back to results</button>
              <div class="flex flex-wrap items-start gap-3">
                <div class="min-w-0 flex-1">
                  <h1 class="truncate text-xl font-semibold" x-text="studentResult.student.displayName || studentResult.student.id"></h1>
                  <p class="text-sm text-muted" x-text="studentResult.student.id + ' · ' + studentResult.assignment"></p>
                </div>
                <span class="rounded-md border border-border px-3 py-1.5 text-sm font-mono" x-text="formatNumber(studentResult.score.points) + ' / ' + formatNumber(studentResult.score.max)"></span>
                <a :href="'/api/runs/' + run.id + '/students/' + studentResult.student.id + '/zip'" class="rounded-md border border-border px-3 py-1.5 text-sm hover:bg-hover">Download ZIP</a>
              </div>
              <div class="mt-2 flex flex-wrap items-center gap-2 text-sm">
                <p :class="studentResult.build.ok ? 'text-success' : 'text-danger'" x-text="studentResult.build.ok ? 'Build succeeded' : 'Build failed: ' + (studentResult.build.message || '')"></p>
                <button type="button" x-show="studentResult.build.log" class="text-accent hover:underline" @click="openText('Build log', studentResult.build.log)">Build log</button>
              </div>
            </section>

            <section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
              <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-muted">Groups</h2>
              <div class="overflow-x-auto">
                <table class="w-full text-sm">
                  <thead class="text-left text-xs uppercase tracking-wide text-muted">
                    <tr><th class="py-1">Group</th><th class="py-1 text-right">Points</th></tr>
                  </thead>
                  <tbody>
                    <template x-for="group in studentResult.score.groups" :key="group.id">
                      <tr class="border-t border-border">
                        <td class="py-1" x-text="group.title?.en || group.title?.sk || group.title || group.id"></td>
                        <td class="py-1 text-right font-mono" x-text="group.pending ? 'pending / ' + formatNumber(group.max) : formatNumber(group.points) + ' / ' + formatNumber(group.max)"></td>
                      </tr>
                    </template>
                  </tbody>
                </table>
              </div>
            </section>

            <section x-show="manualGroups.length" class="rounded-xl border border-border bg-surface p-4 shadow-sm">
              <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-muted">Manual points</h2>
              <div class="grid gap-3 sm:grid-cols-2">
                <template x-for="group in manualGroups" :key="group.id">
                  <label class="block text-sm">
                    <span class="mb-1 block" x-text="group.title + ' (0 – ' + group.points + ')'"></span>
                    <input type="number" min="0" :max="group.points" step="0.5" class="w-full rounded-md border border-border bg-bg px-3 py-2 text-sm outline-none focus:border-accent" x-model.number="manualValues[studentResult.student.id][group.id]" />
                  </label>
                </template>
              </div>
              <button type="button" class="mt-3 rounded-md bg-accent px-3 py-2 text-sm font-semibold text-accent-fg hover:opacity-90 disabled:opacity-50" :disabled="busy" @click="saveManual()">Save and re-score</button>
              <p class="mt-2 text-xs text-muted">Re-scoring reads the stored results; it does not rebuild or rerun student code.</p>
            </section>

            <section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
              <h2 class="mb-2 text-sm font-semibold uppercase tracking-wide text-muted">Scenarios</h2>
              <div class="space-y-2">
                <template x-for="scenario in studentResult.scenarios" :key="scenario.id">
                  <details class="rounded-lg border border-border">
                    <summary class="cursor-pointer px-3 py-2 text-sm">
                      <span class="mr-2 inline-block w-16 text-xs font-semibold uppercase" :class="statusClass(scenario.status)" x-text="scenario.status"></span>
                      <span x-text="scenario.id"></span>
                      <span class="text-muted" x-text="scenario.title?.en || scenario.title?.sk || scenario.title || ''"></span>
                    </summary>
                    <div class="space-y-2 border-t border-border px-3 py-2">
                      <p x-show="scenario.error" class="text-sm text-danger" x-text="scenario.error"></p>
                      <ul class="space-y-1 text-sm">
                        <template x-for="check in scenario.checks" :key="check.name + check.description">
                          <li class="flex gap-2">
                            <span :class="check.pass ? 'text-success' : 'text-danger'" x-text="check.pass ? '✔' : '✘'"></span>
                            <span class="flex-1" x-text="check.description"></span>
                            <button type="button" x-show="check.expected || check.actual || check.message" class="text-xs text-accent hover:underline" @click="openCheck(check)">details</button>
                          </li>
                        </template>
                      </ul>
                      <div class="flex flex-wrap gap-2">
                        <template x-for="artifact in scenario.artifacts" :key="artifact">
                          <button type="button" class="rounded-md border border-border px-2 py-1 text-xs hover:bg-hover" @click="loadArtifact(artifact)" x-text="artifact"></button>
                        </template>
                      </div>
                    </div>
                  </details>
                </template>
              </div>
            </section>

            <section x-show="studentResult.warnings.length" class="rounded-xl border border-warning/40 bg-warning/10 p-4">
              <h2 class="mb-1 text-sm font-semibold text-warning">Warnings</h2>
              <ul class="list-disc space-y-1 pl-5 text-sm">
                <template x-for="warning in studentResult.warnings" :key="warning">
                  <li x-text="warning"></li>
                </template>
              </ul>
            </section>
          </div>
        </template>

        <template x-if="view === 'history'">
          <section class="rounded-xl border border-border bg-surface p-4 shadow-sm">
            <h1 class="text-xl font-semibold">Run history</h1>
            <p class="mb-4 text-sm text-muted">Runs found under <span class="font-mono" x-text="resultsRoot"></span>.</p>
            <div class="overflow-x-auto">
              <table class="w-full text-sm">
                <thead class="text-left text-xs uppercase tracking-wide text-muted">
                  <tr><th class="py-2">Started</th><th class="py-2">Assignment</th><th class="py-2 text-right">Students</th><th class="py-2"></th></tr>
                </thead>
                <tbody>
                  <template x-for="item in runs" :key="item.id">
                    <tr class="border-t border-border">
                      <td class="py-2 font-mono text-xs" x-text="formatDate(item.startedAt)"></td>
                      <td class="py-2" x-text="item.assignment"></td>
                      <td class="py-2 text-right" x-text="item.students.length"></td>
                      <td class="py-2 text-right"><button type="button" class="text-accent hover:underline" @click="openRun(item.id)">Open</button></td>
                    </tr>
                  </template>
                  <tr x-show="runs.length === 0"><td colspan="4" class="py-6 text-center text-sm text-muted">No runs yet.</td></tr>
                </tbody>
              </table>
            </div>
          </section>
        </template>
      </section>
    </main>

    <div x-show="browser.open" class="fixed inset-0 z-50 grid place-items-center bg-black/50 p-4" @click.self="browser.open = false">
      <div class="w-full max-w-2xl rounded-xl border border-border bg-surface p-4 shadow-xl">
        <div class="mb-3 flex items-center gap-2">
          <h2 class="text-lg font-semibold" x-text="browser.mode === 'assignment' ? 'Choose assignment folder' : 'Choose submissions folder or ZIP'"></h2>
          <button type="button" class="ml-auto rounded-md px-2 py-1 text-muted hover:bg-hover" @click="browser.open = false">Close</button>
        </div>
        <div class="mb-3 flex gap-2">
          <input x-model="browser.path" class="min-w-0 flex-1 rounded-md border border-border bg-bg px-3 py-2 font-mono text-xs" @keydown.enter="browseTo(browser.path)" />
          <button type="button" class="rounded-md border border-border px-3 py-2 text-sm hover:bg-hover" @click="browseTo(browser.path)">Go</button>
        </div>
        <div class="max-h-80 overflow-auto rounded-md border border-border">
          <button x-show="browser.parent" type="button" class="flex w-full items-center gap-2 border-b border-border px-3 py-2 text-left text-sm hover:bg-hover" @click="browseTo(browser.parent)">↑ Parent folder</button>
          <template x-for="entry in browser.entries" :key="entry.path">
            <button type="button" class="flex w-full items-center gap-2 border-b border-border px-3 py-2 text-left text-sm hover:bg-hover" @click="entry.kind === 'dir' ? browseTo(entry.path) : chooseFile(entry.path)">
              <span x-text="entry.kind === 'dir' ? '📁' : '🗜'"></span>
              <span class="truncate" x-text="entry.name"></span>
            </button>
          </template>
          <p x-show="browser.entries.length === 0" class="px-3 py-6 text-center text-sm text-muted">No folders here.</p>
        </div>
        <div class="mt-3 flex justify-end gap-2">
          <button type="button" class="rounded-md bg-accent px-3 py-2 text-sm font-semibold text-accent-fg hover:opacity-90" @click="chooseCurrent()" x-text="browser.mode === 'assignment' ? 'Use this folder' : 'Use this folder'"></button>
        </div>
      </div>
    </div>

    <div x-show="overlay" class="fixed inset-0 z-50 grid place-items-center bg-black/50 p-4" @click.self="overlay = null">
      <div class="max-h-[85vh] w-full max-w-3xl overflow-auto rounded-xl border border-border bg-surface p-4 shadow-xl">
        <div class="mb-2 flex items-center gap-2">
          <h2 class="text-lg font-semibold" x-text="overlay?.title"></h2>
          <button type="button" class="ml-auto rounded-md px-2 py-1 text-muted hover:bg-hover" @click="overlay = null">Close</button>
        </div>
        <pre class="whitespace-pre-wrap break-words rounded-md bg-code p-3 font-mono text-xs text-code-fg" x-text="overlay?.text"></pre>
      </div>
    </div>

    <div x-show="serverStopped" class="fixed bottom-4 left-1/2 z-50 -translate-x-1/2 rounded-lg border border-border bg-surface px-4 py-2 text-sm shadow-lg">The server has stopped. You can close this tab.</div>
  </body>
</html>
