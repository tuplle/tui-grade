# MISSION CONTROL: example assignment (a C17 command-line mission simulator).
# The grading table of the assignment README: 2 + 3 + 5 + 3 + 3 + 4 = 20 points.
name: mission
max_points: 20
locale: sk

build:
  type: gcc
  sources: [src/main.c]
  output: bin/mission
  std: c17
binary: bin/mission
project_root_marker: src/main.c

# Submissions are named surname_name_login_project1(.zip); the login becomes the student id.
student_id:
  pattern: '^(?<surname>[^_]+)_(?<name>[^_]+)_(?<login>[^_]+)_project1$'

scoring:
  use: proportional
  rounding: ceil
  cap: true

limits:
  build_timeout_sec: 60
  run_timeout_sec: 5

groups:
  - id: build
    title: { sk: 'Kompilácia, štruktúra projektu a spustiteľnosť', en: 'Compilation, project structure and runnability' }
    points: 2
    requires_build: false
  - id: args
    title: { sk: 'Spracovanie argumentov, --help a validácia', en: 'Arguments, --help and validation' }
    points: 3
    requires_build: true
  - id: simulation
    title: { sk: 'Simulácia dní, spotreby a slnečnej búrky', en: 'Simulation of days, consumption and the solar storm' }
    points: 5
    requires_build: true
  - id: interactive
    title: { sk: 'Interaktívne pokračovanie/ukončenie a režim --non-interactive', en: 'Interactive continue/stop and --non-interactive' }
    points: 3
    requires_build: true
  - id: statistics
    title: { sk: 'Záverečná štatistika a výsledné stavy', en: 'Final statistics and resulting states' }
    points: 3
    requires_build: true
  - id: quality
    title: { sk: 'Rozdelenie do funkcií, čitateľnosť a komunikácia chýb', en: 'Functions, readability and error communication' }
    points: 4
    manual: true
