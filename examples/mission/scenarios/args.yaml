- id: args-unknown-positional
  title: { sk: Neznámy argument bez prefixu, en: Unknown argument without prefix }
  group: args
  weight: 0.5
  run:
    args: [ --crew, '2', --days, '3', --food, '6', --oxygen, '12', extra, --non-interactive ]
  expect:
    - exit_code: nonzero
    - any_of: *has_message
