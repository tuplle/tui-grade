    - any_of: *has_message
- id: args-no-arguments
  title: { sk: Spustenie bez argumentov, en: Started without arguments }
  group: args
  weight: 0.5
  run:
    args: []
  expect:
    - exit_code: nonzero
    - any_of: *has_message
- id: args-bad-crew-${value}
  title: { sk: 'Neplatná hodnota --crew: ${value}', en: 'Invalid value of --crew: ${value}' }
  group: args
  weight: 0.25
  matrix:
    value: [ abc, 2x, '1.5', '0', '101' ]
  run:
    args: [ --crew, '${value}', --days, '3', --food, '6', --oxygen, '12', --non-interactive ]
  expect:
    - exit_code: nonzero
    - any_of: *has_message
- id: args-bad-days-${value}
