# Group "args": --help, argument parsing and validation errors.

# The README requires the exact word Help (or Pomoc).
- id: args-help
  title: { sk: Nápoveda --help, en: Help output (--help) }
  group: args
  weight: 3
  run:
    args: [ --help ]
  expect:
    - any_of:
        - stdout_contains: Help
        - stdout_contains: Pomoc
        - stderr_contains: Help
        - stderr_contains: Pomoc
    - any_of:
        - stdout_contains: --non-interactive
        - stderr_contains: --non-interactive
- id: args-any-order
  title: { sk: Argumenty v ľubovoľnom poradí, en: Arguments in any order }
  group: args
  weight: 3
  run:
    args: [ --non-interactive, --oxygen, '12', --days, '3', --crew, '2', --food, '6' ]
  expect:
    - exit_code: 0
    - stdout_matches: &success_wording { pattern: \buspesne\s+dokonc|\bsuccessful|\bsuccessfully|mission\s+(?:was\s+)?complete, ignore_case: true, fold_diacritics: true }
    - stdout_matches: &percent_100_00 { pattern: \b100\.00\s*%, ignore_case: true, fold_diacritics: true }
- id: args-missing-crew
  title: { sk: Chýba povinný argument --crew, en: Required argument --crew is missing }
  group: args
  run:
    args: [ --days, '3', --food, '6', --oxygen, '12', --non-interactive ]
  expect:
    - exit_code: nonzero
    - any_of: &has_message
        - stderr_matches: \S
        - stdout_matches: \S
- id: args-missing-days
  title: { sk: Chýba povinný argument --days, en: Required argument --days is missing }
  group: args
  run:
    args: [ --crew, '2', --food, '6', --oxygen, '12', --non-interactive ]
  expect:
    - exit_code: nonzero
    - any_of: *has_message
- id: args-missing-food
  title: { sk: Chýba povinný argument --food, en: Required argument --food is missing }
  group: args
