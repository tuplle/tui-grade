- id: args-missing-value
  title: { sk: Argument bez hodnoty (--oxygen na konci), en: Argument without a value (--oxygen last) }
  group: args
  run:
    args: [ --crew, '2', --days, '3', --food, '6', --oxygen ]
  expect:
